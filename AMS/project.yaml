goal: A website that lets people Luke sends it to run a fact-check on pasted text, using the cellear/claude-fact-check-skill methodology, and get a permanent shareable result page.
audience: Luke's own network — people he sends the URL to. Not a growth play.
success: Luke sends the URL and invite word to people; they paste a claim, wait under three minutes, and forward a permalink. Luke never has to administer anything, and spend stops dead at the cap.
constraints:
  - Stack: static HTML + one serverless function + one key-value bucket. No Drupal, no Pantheon, nothing Luke administers. See DOC/architecture.md.
  - Budget: $20/month hard cap on API spend; silent refusal when reached.
  - Latency: a check may take up to three minutes; visitors wait, with a predicted countdown.
  - Model: claude-sonnet-5 (Haiku 4.5 evaluated in the Sprint 1 spike).
  - Access: shared invite word; results public to anyone with the link.
  - Process: agents never push; Luke shapes the first commit; sprints are accepted by demo script or fix stories are added. See DOC/working-agreements.md.
  - Documentation: anything in DOC/ or LEARNINGS/ is written by Lila; each agent writes its own handoff.
